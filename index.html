<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Royal Log — Poop Counter</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f6f1e7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream: #f6f1e7;
    --cream-2:#efe7d6;
    --ink:   #2b2118;
    --ink-2: #5a4a3a;
    --line:  #e3d9c4;
    --brand: #8a5a2b;
    --brand-2:#6b3f17;
    --gold:  #c8901c;
    --gold-soft:#f3d27a;
    --leaf:  #4a7d3a;
    --rose:  #b34a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"DM Sans","Helvetica Neue",Helvetica,sans-serif;
    font-feature-settings:"ss01","cv11";
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none}
  body{min-height:100vh;min-height:100dvh}
  .display{font-family:"Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-0.02em;line-height:.95}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .tabnum{font-variant-numeric:tabular-nums}

  /* shell */
  .shell{max-width:480px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom));
    min-height:100dvh}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;
    padding-top:env(safe-area-inset-top)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);flex-shrink:0;
    display:grid;place-items:center;color:var(--cream);font-family:"Bricolage Grotesque",sans-serif;
    font-weight:800;font-size:18px;letter-spacing:-.04em;
    box-shadow:0 2px 0 #00000020,inset 0 1px 0 #ffffff14}
  .brand h1{margin:0;font:800 18px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Bottom tab bar */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    background:rgba(246,241,231,.92);
    -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid var(--line);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px #00000010}
  .nav button{appearance:none;border:0;background:transparent;color:var(--ink-2);
    font:600 11px/1.2 "DM Sans",sans-serif;padding:8px 0 4px;border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.02em}
  .nav button .ti{font-size:22px;line-height:1;filter:grayscale(.4) opacity(.7);transition:filter .15s, transform .15s}
  .nav button[aria-current="true"]{color:var(--ink)}
  .nav button[aria-current="true"] .ti{filter:none;transform:translateY(-1px)}
  .nav button[aria-current="true"] .ti-dot{display:block}
  .ti-dot{display:none;width:5px;height:5px;border-radius:99px;background:var(--brand);margin-top:1px}

  /* grid */
  .grid{display:grid;gap:14px}
  .grid.two{grid-template-columns:1fr}
  @media (min-width:780px){
    .shell{max-width:1180px;padding:28px 28px 80px}
    .top{margin-bottom:18px;padding-top:0}
    .brand-mark{width:42px;height:42px;border-radius:13px;font-size:22px}
    .brand h1{font-size:22px}
    .grid{gap:18px}
    .grid.two{grid-template-columns:1.15fr .85fr}
    .nav{position:static;display:flex;grid-template-columns:none;gap:4px;
      background:#0000000a;padding:4px;border-radius:12px;border:1px solid var(--line);
      box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
    .nav button{flex-direction:row;font-size:13px;padding:8px 14px;border-radius:9px;gap:6px}
    .nav button .ti{font-size:14px;filter:none}
    .nav button[aria-current="true"]{background:var(--cream);
      box-shadow:0 1px 0 #00000010, 0 1px 4px #0000000d;border:1px solid var(--line)}
    .ti-dot{display:none !important}
  }

  /* cards */
  .card{background:#fffdf7;border:1px solid var(--line);border-radius:18px;padding:18px;
    box-shadow:0 1px 0 #ffffff inset, 0 2px 0 #00000005}
  .card.tight{padding:14px}
  .card h2{margin:0 0 4px;font:700 17px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
  .card .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:12px}
  @media (min-width:780px){
    .card{padding:22px}
    .card h2{font-size:18px}
  }

  /* hero counter */
  .hero{position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #fbe7b8 0%, transparent 60%),
      linear-gradient(180deg, #fffdf7 0%, #fcf6e7 100%);
    padding:22px 20px 24px;text-align:center}
  .hero .row{display:flex;flex-direction:column;align-items:center;gap:6px}
  .today-label{font:600 11px/1 "DM Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
  .today-num{font:800 88px/.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-top:6px}
  .today-num small{font:600 14px/1 "DM Sans",sans-serif;color:var(--ink-2);margin-left:6px;letter-spacing:0;
    text-transform:none;vertical-align:middle}
  .streak{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-size:12.5px;margin-top:10px}
  .streak b{color:var(--ink)}
  @media (min-width:780px){
    .hero{padding:30px 26px 26px;text-align:left}
    .hero .row{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:16px}
    .today-num{font-size:96px;margin-top:8px}
    .today-num small{font-size:16px;margin-left:8px}
    .streak{justify-content:flex-start;font-size:13px;margin-top:14px}
  }

  /* big button */
  .plop-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
  .plop{
    appearance:none;border:0;cursor:pointer;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle at 30% 25%, #b07a45 0%, #7a4a1f 55%, #4f2d10 100%);
    color:#fff;font:800 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;
    box-shadow:
      inset 0 -10px 24px #00000055,
      inset 0 8px 18px #ffffff22,
      0 18px 28px -8px #6b3f1755,
      0 4px 0 #4f2d10;
    transition:transform .08s ease, box-shadow .08s ease, filter .12s;
    display:grid;place-items:center;position:relative;
    user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plop:hover{filter:brightness(1.04)}
  .plop:active{transform:translateY(3px);box-shadow:
    inset 0 -6px 18px #00000055,inset 0 6px 14px #ffffff22,
    0 8px 18px -6px #6b3f1755, 0 1px 0 #4f2d10}
  .plop .glyph{font-size:56px;line-height:1;display:block;margin-bottom:4px;filter:drop-shadow(0 2px 0 #00000033)}
  .plop .lbl{display:block;text-shadow:0 1px 0 #00000044}
  @media (min-width:780px){
    .plop{width:200px;height:200px;font-size:22px}
    .plop .glyph{font-size:64px}
  }

  .undo{appearance:none;background:transparent;border:1px dashed #00000033;color:var(--ink-2);
    padding:8px 14px;border-radius:99px;font:600 12px/1 "DM Sans";cursor:pointer;
    min-height:36px}
  .undo:hover{background:#00000008;color:var(--ink)}

  /* stat strip */
  .stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .stat{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .stat .k{font:600 10px/1 "DM Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .stat .v{font:800 24px/1 "Bricolage Grotesque",sans-serif;margin-top:6px;letter-spacing:-.02em}
  .stat .v small{font:600 11px/1 "DM Sans";color:var(--ink-2);margin-left:4px;letter-spacing:0}
  @media (min-width:780px){
    .stat-strip{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
    .stat{padding:12px 14px}
    .stat .k{font-size:10.5px;letter-spacing:.16em}
    .stat .v{font-size:26px}
    .stat .v small{font-size:12px}
  }

  /* tier */
  .tier{display:flex;align-items:center;gap:12px}
  .tier-badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;
    background:linear-gradient(160deg, #fbe7b8 0%, #c8901c 100%);flex-shrink:0;
    box-shadow:inset 0 1px 0 #ffffff80, 0 2px 0 #0000001a}
  .tier-name{font:800 19px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
  .tier-flavor{color:var(--ink-2);font-size:12.5px;margin-top:4px}
  .tier-progress{margin-top:14px}
  .bar{height:10px;background:#0000000d;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg, var(--brand) 0%, var(--gold) 100%);
    border-radius:99px}
  .tier-progress .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);margin-top:6px}

  .tier-ladder{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .rung{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;
    padding:8px 10px;border-radius:10px;border:1px solid transparent}
  .rung.active{background:#fbe7b833;border-color:#e7c777}
  .rung .ico{font-size:20px;text-align:center}
  .rung .nm{font-weight:700;font-size:13px}
  .rung .rg{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.3}
  .rung .num{font:700 11px/1 "JetBrains Mono",monospace;color:var(--ink-2);
    padding:4px 8px;border-radius:99px;background:#00000008}
  @media (min-width:780px){
    .tier-badge{width:64px;height:64px;border-radius:18px;font-size:32px}
    .tier-name{font-size:22px}
    .tier-flavor{font-size:13px}
    .rung{grid-template-columns:36px 1fr auto;gap:12px;padding:9px 12px}
    .rung .nm{font-size:13.5px}
    .rung .rg{font-size:11.5px}
    .rung .num{font-size:12px}
  }

  /* calendar heatmap */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font:600 10px/1 "DM Sans";text-align:center;color:var(--ink-2);letter-spacing:.1em;
    text-transform:uppercase;padding-bottom:4px}
  .cell{aspect-ratio:1;border-radius:8px;background:#00000008;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:space-between;padding:4px 5px;border:1px solid transparent;
    position:relative;cursor:default;font-size:10px;min-width:0}
  .cell.empty{background:transparent;border:0}
  .cell.today{border-color:var(--ink)}
  .cell .d{font-weight:600;color:var(--ink);opacity:.65;font-size:10px}
  .cell .c{font-weight:800;font-size:12px;font-family:"Bricolage Grotesque",sans-serif;color:#fff;
    line-height:1;align-self:flex-end}
  .cell[data-h="0"]{background:#0000000a}
  .cell[data-h="1"]{background:#e7c98a}
  .cell[data-h="2"]{background:#d6a655}
  .cell[data-h="3"]{background:#a06a2a}
  .cell[data-h="4"]{background:#6b3f17}
  .cell[data-h="0"] .c{color:transparent}
  .cell[data-h="1"] .c, .cell[data-h="2"] .c{color:#2b2118}
  @media (min-width:780px){
    .cal{gap:6px}
    .cell{border-radius:10px;padding:6px 7px;font-size:11px}
    .cell .d{font-size:11px}
    .cell .c{font-size:14px}
  }

  .month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .month-head h2{margin:0}
  .month-nav{display:flex;align-items:center;gap:4px}
  .month-nav button{appearance:none;border:1px solid var(--line);background:#fffdf7;width:34px;height:34px;
    border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px;line-height:1;
    -webkit-tap-highlight-color:transparent}
  .month-nav button:hover{background:#fbe7b855}
  .month-nav .lbl{padding:0 6px;font-weight:700;font-size:13px;min-width:auto;text-align:center}
  @media (min-width:780px){
    .month-nav button{width:30px;height:30px}
    .month-nav .lbl{padding:0 8px;font-size:13.5px;min-width:130px}
  }

  /* log list */
  .log{display:flex;flex-direction:column;gap:0}
  .log-group{font:600 10px/1 "DM Sans";letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-2);margin:12px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .log-group:first-child{margin-top:0}
  .log-group b{color:var(--ink);font-size:12px;letter-spacing:0;text-transform:none;font-weight:700;
    font-family:"Bricolage Grotesque",sans-serif}
  .log-item{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;
    padding:9px 2px;border-top:1px dashed var(--line)}
  .log-item:first-of-type{border-top:0}
  .log-item .pip{font-size:16px;width:28px;text-align:center;filter:saturate(.9)}
  .log-item .time{font:600 14px/1 "DM Sans"}
  .log-item .rel{font:500 11px/1 "JetBrains Mono",monospace;color:var(--ink-2);margin-top:3px}
  .log-item .tag{font:600 9.5px/1 "DM Sans";letter-spacing:.05em;text-transform:uppercase;
    padding:5px 8px;border-radius:99px;background:#00000008;color:var(--ink-2);white-space:nowrap}
  .log-item .del{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
    width:32px;height:32px;border-radius:8px;font-size:16px;opacity:.5;
    -webkit-tap-highlight-color:transparent}
  .log-item .del:hover, .log-item .del:active{background:#0000000a;color:var(--rose);opacity:1}
  @media (min-width:780px){
    .log-item{grid-template-columns:auto 1fr auto auto;gap:12px;padding:10px 4px}
    .log-item .pip{font-size:18px;width:30px}
    .log-item .rel{font-size:11.5px}
    .log-item .tag{font-size:10.5px;letter-spacing:.06em;padding:5px 9px}
  }
  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-2)}
  .empty-state .big{font-size:38px;margin-bottom:8px;filter:grayscale(.4) opacity(.7)}
  .empty-state h3{margin:0 0 4px;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;color:var(--ink)}

  /* leaderboard */
  .lb-tabs{display:inline-flex;background:#0000000a;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
  .lb-tabs button{appearance:none;border:0;background:transparent;color:var(--ink-2);
    font:600 12px/1 "DM Sans";padding:8px 14px;border-radius:7px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .lb-tabs button[aria-current="true"]{background:#fffdf7;color:var(--ink);border:1px solid var(--line)}

  .lb-row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;
    padding:10px 6px;border-top:1px dashed var(--line)}
  .lb-row:first-of-type{border-top:0}
  .lb-row .rk{font:800 13px/1 "Bricolage Grotesque";color:var(--ink-2);text-align:center}
  .lb-row .nm{font-weight:700;font-size:13px}
  .lb-row .meta{font-size:11px;color:var(--ink-2);margin-top:2px}
  .lb-row .bar2{display:none}
  .lb-row .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}
  .lb-row .ct{font:800 16px/1 "Bricolage Grotesque";min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
  .lb-row.gold .rk{color:var(--gold)}
  .lb-row.silver .rk{color:#9aa0a6}
  .lb-row.bronze .rk{color:#b56a2a}
  @media (min-width:780px){
    .lb-row{grid-template-columns:28px 1fr auto auto;gap:12px}
    .lb-row .rk{font-size:14px}
    .lb-row .nm{font-size:13.5px}
    .lb-row .meta{font-size:11.5px}
    .lb-row .bar2{display:block;width:120px;height:8px;background:#0000000d;border-radius:99px;overflow:hidden}
  }

  /* footer */
  .foot{margin-top:18px;color:var(--ink-2);font-size:11.5px;text-align:center}
  .foot a{color:inherit}

  /* plop animation */
  @keyframes pop {
    0%{transform:scale(1)}
    35%{transform:scale(1.08)}
    100%{transform:scale(1)}
  }
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}

  /* confetti */
  .confetti{position:fixed;pointer-events:none;font-size:28px;animation:drop 1.1s ease-in forwards;z-index:9999}
  @keyframes drop{
    0%  {transform:translate(0,-20px) rotate(0deg); opacity:0}
    20% {opacity:1}
    100%{transform:translate(var(--dx,0px), 70vh) rotate(var(--rot,360deg)); opacity:0}
  }

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:99px;
    font:600 13px/1 "DM Sans";box-shadow:0 8px 24px #0000003a;z-index:9998;
    opacity:0;transition:opacity .2s, transform .2s;white-space:nowrap;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media (min-width:780px){
    .toast{bottom:30px}
  }

  /* milestone modal */
  .modal-overlay{
    position:fixed;inset:0;z-index:10000;
    background:rgba(43,33,24,.6);
    -webkit-backdrop-filter:blur(8px) saturate(120%);backdrop-filter:blur(8px) saturate(120%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-box{
    background:#fffdf7;border:1px solid var(--line);border-radius:24px;
    padding:32px 28px 28px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 24px 80px #00000040, 0 1px 0 #ffffff inset;
    animation:slideUp .25s cubic-bezier(.2,1.4,.4,1)}
  @keyframes slideUp{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .modal-emoji{font-size:64px;line-height:1;margin-bottom:16px;
    animation:wobble .6s cubic-bezier(.2,1.4,.4,1)}
  @keyframes wobble{
    0%{transform:scale(.6) rotate(-10deg)}
    50%{transform:scale(1.15) rotate(6deg)}
    100%{transform:scale(1) rotate(0deg)}}
  .modal-msg{
    font:700 17px/1.45 "DM Sans",sans-serif;color:var(--ink);
    margin:0 0 24px}
  .modal-btn{
    appearance:none;border:0;cursor:pointer;
    background:var(--ink);color:var(--cream);
    font:700 14px/1 "DM Sans",sans-serif;
    padding:14px 32px;border-radius:99px;
    box-shadow:0 4px 0 #00000033,0 8px 20px #00000020;
    transition:transform .08s,box-shadow .08s;
    -webkit-tap-highlight-color:transparent}
  .modal-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #00000033,0 4px 10px #00000020}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ─── Milestone messages ────────────────────────────────────────────────────
    const MILESTONES = {
      3: [
        "Three times today? Wow, an elite digestive system. A true poop champion.",
        "Three times? Your metabolism is working overtime, huh?",
        "Three poops a day? Look at you, Mr./Ms. Efficient Digestion!",
        "Three rounds already? Are you trying to set a local record or what?",
        "Three times? Honestly, I'm kind of jealous of your fast-track stomach.",
      ],
      5: [
        "Five times?! Is your asshole okay, or is it calling for backup?",
        "Five rounds? Seriously, is everything okay down there?",
        "Five times? At this point, you should just move your bed into the toilet.",
      ],
      7: [
        "Seven times? Buddy, are you sure you're alive? Do we need to go to the ER?",
        "Seven times? Are you pooping out your past mistakes too?",
      ],
      10: [
        "Ten times?! Do you even have a colon, or is your throat connected straight to your butt?",
        "Achievement Unlocked: 10 Shits. Reward: A lifetime supply of hemorrhoid cream.",
      ],
    };

    const MILESTONE_EMOJIS = { 3: "💩", 5: "🚨", 7: "😱", 10: "🏆" };

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // ─── Tiers ────────────────────────────────────────────────────────────────
    const TIERS = [
      { key:"dormant",  ico:"🌱", name:"Dormant Cheeks",    min:0,  flavor:"Patience. Greatness ferments." },
      { key:"bronze",   ico:"🥉", name:"Bronze Bowel",       min:1,  flavor:"Off the mark, into the bowl." },
      { key:"silver",   ico:"🥈", name:"Silver Squatter",    min:8,  flavor:"Reliable. Punctual. Respectable." },
      { key:"gold",     ico:"🥇", name:"Gold Plopper",       min:16, flavor:"Olympic-tier intestinal flora." },
      { key:"platinum", ico:"💎", name:"Platinum Pipework",  min:26, flavor:"Smooth operator. Frictionless." },
      { key:"royal",    ico:"👑", name:"Royal Flusher",      min:36, flavor:"Subjects bow as you exit the WC." },
      { key:"legend",   ico:"🐉", name:"Mythic Mudslinger",  min:50, flavor:"Spoken of in hushed bathroom tones." },
    ];
    const tierFor = (n) => TIERS.slice().reverse().find(t => n >= t.min) || TIERS[0];
    const nextTier = (n) => TIERS.find(t => n < t.min);

    const TAGS = ["📰 Reader","⚡ Quickie","🧘 Meditative","☕ Post-coffee","🌙 Midnight","🚀 Express","🎧 Podcast","🧗 Climber"];
    const tagFor = (ts) => TAGS[(Math.floor(ts/60000)) % TAGS.length];

    // ─── Storage ──────────────────────────────────────────────────────────────
    const LS_KEY = "poop-counter:v1";
    const loadLog = () => {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return seedLog();
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : seedLog();
      } catch { return seedLog(); }
    };
    const saveLog = (arr) => { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch {} };

    function seedLog(){
      const now = Date.now();
      const out = [];
      const day = 86400000;
      const rng = (s) => { let x=Math.sin(s)*10000; return x-Math.floor(x); };
      for (let d=45; d>=1; d--) {
        const base = now - d*day;
        const n = Math.floor(rng(d)*3.6);
        for (let i=0;i<n;i++){
          const hour = 6 + Math.floor(rng(d*10+i)*15);
          const min  = Math.floor(rng(d*100+i)*60);
          const ts = new Date(base);
          ts.setHours(hour, min, Math.floor(rng(d+i)*60), 0);
          out.push(ts.getTime());
        }
      }
      out.sort((a,b)=>a-b);
      return out;
    }

    // ─── Date helpers ─────────────────────────────────────────────────────────
    const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
    const sameDay = (a,b) => startOfDay(a).getTime() === startOfDay(b).getTime();
    const monthLabel = (d) => d.toLocaleString(undefined, { month:"long", year:"numeric" });
    const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
    const relTime = (ts) => {
      const s = (Date.now()-ts)/1000;
      if (s<60) return `${Math.max(1,Math.floor(s))}s ago`;
      if (s<3600) return `${Math.floor(s/60)}m ago`;
      if (s<86400) return `${Math.floor(s/3600)}h ago`;
      const d = Math.floor(s/86400);
      return `${d}d ago`;
    };
    const startOfWeek = (d) => {
      const x = startOfDay(d);
      const dow = x.getDay();
      x.setDate(x.getDate() - dow);
      return x;
    };

    // ─── Milestone Modal ──────────────────────────────────────────────────────
    function MilestoneModal({ count, message, onClose }) {
      if (!message) return null;
      const emoji = MILESTONE_EMOJIS[count] || "💩";
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-emoji">{emoji}</div>
            <p className="modal-msg">{message}</p>
            <button className="modal-btn" onClick={onClose}>Got it 💪</button>
          </div>
        </div>
      );
    }

    // ─── Hero counter ─────────────────────────────────────────────────────────
    function HeroCounter({ todayCount, onLog, onUndo, canUndo, streakDays, weeklyAvg }) {
      const [pop, setPop] = useState(0);
      const handle = () => {
        onLog();
        setPop(p => p+1);
      };
      return (
        <section className="card hero">
          <div className="row">
            <div>
              <div className="today-label">Today's log</div>
              <div className={"today-num display tabnum " + (pop?"pop":"")}
                   key={"n-"+todayCount}
                   onAnimationEnd={()=>setPop(0)}>
                {todayCount}<small>{todayCount===1?"plop":"plops"}</small>
              </div>
              <div className="streak">
                <span>🔥 <b>{streakDays}-day</b> streak</span>
                <span style={{opacity:.4}}>·</span>
                <span>Avg <b>{weeklyAvg.toFixed(1)}/wk</b></span>
              </div>
            </div>
            <div className="plop-wrap">
              <button className="plop" onClick={handle} aria-label="Log a poop">
                <span className="glyph" aria-hidden="true">💩</span>
                <span className="lbl">Log a Plop</span>
              </button>
              <button className="undo" onClick={onUndo} disabled={!canUndo}
                      style={{opacity: canUndo?1:.4, cursor: canUndo?"pointer":"default"}}>
                ↶ Undo last
              </button>
            </div>
          </div>
        </section>
      );
    }

    // ─── Stat strip ───────────────────────────────────────────────────────────
    function StatStrip({ stats }) {
      return (
        <div className="stat-strip">
          {stats.map(s => (
            <div className="stat" key={s.k}>
              <div className="k">{s.k}</div>
              <div className="v tabnum">{s.v}<small>{s.unit||""}</small></div>
            </div>
          ))}
        </div>
      );
    }

    // ─── Tier card ────────────────────────────────────────────────────────────
    function TierCard({ monthlyCount }) {
      const t = tierFor(monthlyCount);
      const nxt = nextTier(monthlyCount);
      const pct = nxt ? Math.min(100, Math.round((monthlyCount - t.min) / (nxt.min - t.min) * 100)) : 100;
      return (
        <section className="card">
          <h2>Current rank</h2>
          <div className="sub">Based on this month's count</div>
          <div className="tier">
            <div className="tier-badge" aria-hidden="true">{t.ico}</div>
            <div>
              <div className="tier-name">{t.name}</div>
              <div className="tier-flavor">"{t.flavor}"</div>
            </div>
          </div>
          <div className="tier-progress">
            <div className="bar"><i style={{width:pct+"%"}}/></div>
            <div className="meta">
              <span>{monthlyCount} this month</span>
              <span>{nxt ? `${nxt.min - monthlyCount} to ${nxt.name} ${nxt.ico}` : "Max tier reached 🐉"}</span>
            </div>
          </div>
          <div className="tier-ladder" style={{marginTop:18}}>
            {TIERS.map(rung => (
              <div key={rung.key} className={"rung "+(rung.key===t.key?"active":"")}>
                <div className="ico">{rung.ico}</div>
                <div>
                  <div className="nm">{rung.name}</div>
                  <div className="rg">{rung.flavor}</div>
                </div>
                <div className="num tabnum">{rung.min}+</div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ─── Calendar heatmap ─────────────────────────────────────────────────────
    function CalendarMonth({ year, month, counts, onPrev, onNext }) {
      const first = new Date(year, month, 1);
      const daysIn = new Date(year, month+1, 0).getDate();
      const leading = first.getDay();
      const cells = [];
      for (let i=0;i<leading;i++) cells.push({ empty:true, k:"e"+i });
      for (let d=1; d<=daysIn; d++){
        const date = new Date(year, month, d);
        const c = counts[d] || 0;
        cells.push({ d, c, date, today: sameDay(date, new Date()), k:"d"+d });
      }
      while (cells.length % 7 !== 0) cells.push({ empty:true, k:"t"+cells.length });
      const heat = (c) => c===0?0 : c<=1?1 : c<=2?2 : c<=3?3 : 4;
      const dow = ["S","M","T","W","T","F","S"];
      const monthTotal = Object.values(counts).reduce((a,b)=>a+b,0);
      return (
        <section className="card">
          <div className="month-head">
            <div>
              <h2>{monthLabel(first)}</h2>
              <div className="sub" style={{margin:0}}>{monthTotal} total · {monthTotal? (monthTotal/daysIn).toFixed(2):"0.00"} per day avg</div>
            </div>
            <div className="month-nav">
              <button onClick={onPrev} aria-label="Previous month">←</button>
              <span className="lbl">{monthLabel(first)}</span>
              <button onClick={onNext} aria-label="Next month">→</button>
            </div>
          </div>
          <div className="cal" style={{marginBottom:8}}>
            {dow.map((x,i)=><div className="dow" key={"h"+i}>{x}</div>)}
          </div>
          <div className="cal">
            {cells.map(c => c.empty
              ? <div className="cell empty" key={c.k}/>
              : <div className={"cell"+(c.today?" today":"")} data-h={heat(c.c)} key={c.k} title={`${c.c} plops`}>
                  <div className="d">{c.d}</div>
                  <div className="c">{c.c||""}</div>
                </div>
            )}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:14,fontSize:11.5,color:"var(--ink-2)"}}>
            <span>Less</span>
            {[0,1,2,3,4].map(h=>(
              <span key={h} data-h={h} className="cell"
                    style={{width:18,height:18,aspectRatio:"auto",padding:0,borderRadius:5}}/>
            ))}
            <span>More</span>
          </div>
        </section>
      );
    }

    // ─── Log list ─────────────────────────────────────────────────────────────
    function LogList({ log, onDelete }) {
      if (!log.length) return (
        <section className="card">
          <h2>Recent activity</h2>
          <div className="empty-state">
            <div className="big">🚽</div>
            <h3>No plops on record</h3>
            <div>Tap the big brown button when nature calls.</div>
          </div>
        </section>
      );
      const groups = [];
      const sorted = log.slice().sort((a,b)=>b-a);
      let currentKey = null;
      for (const ts of sorted){
        const d = new Date(ts);
        const k = startOfDay(d).getTime();
        if (k !== currentKey){
          currentKey = k;
          groups.push({ k, date:d, items:[] });
        }
        groups[groups.length-1].items.push(ts);
      }
      const todayMs = startOfDay(new Date()).getTime();
      const yMs = todayMs - 86400000;
      const dayLabel = (k) => k===todayMs?"Today" : k===yMs?"Yesterday"
          : new Date(k).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
      return (
        <section className="card">
          <h2>Recent activity</h2>
          <div className="sub">Newest first. Tap × to remove a mis-tap.</div>
          <div className="log">
            {groups.slice(0,8).map(g => (
              <React.Fragment key={g.k}>
                <div className="log-group">
                  <b>{dayLabel(g.k)}</b>
                  <span>{g.items.length} {g.items.length===1?"plop":"plops"}</span>
                </div>
                {g.items.map(ts => (
                  <div className="log-item" key={ts}>
                    <div className="pip" aria-hidden="true">💩</div>
                    <div>
                      <div className="time">{fmtTime(new Date(ts))}</div>
                      <div className="rel">{relTime(ts)}</div>
                    </div>
                    <div className="tag">{tagFor(ts)}</div>
                    <button className="del" onClick={()=>onDelete(ts)} aria-label="Remove entry">×</button>
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        </section>
      );
    }

    // ─── Leaderboard ──────────────────────────────────────────────────────────
    const FRIEND_SEED = [
      { name:"Bea S.",   base:38 },
      { name:"Cleo M.",  base:31 },
      { name:"Theo K.",  base:24 },
      { name:"Wren L.",  base:19 },
      { name:"Jules P.", base:14 },
      { name:"Mo R.",    base:11 },
      { name:"Sam T.",   base:7  },
    ];
    function Leaderboard({ monthly, weekly }) {
      const [period, setPeriod] = useState("monthly");
      const myCount = period==="monthly" ? monthly : weekly;
      const fakeMul = period==="monthly" ? 1 : 0.32;
      const rows = FRIEND_SEED.map(f => ({
        name: f.name,
        count: Math.max(0, Math.round(f.base * fakeMul)),
      })).concat([{ name: "You", count: myCount, isYou:true }])
        .sort((a,b)=>b.count - a.count);
      const top = rows[0].count || 1;
      const medal = ["gold","silver","bronze"];
      return (
        <section className="card">
          <h2>Hall of Plops</h2>
          <div className="sub">How you stack up against your bathroom-rivals.</div>
          <div className="lb-tabs" role="tablist">
            {["weekly","monthly"].map(p=>(
              <button key={p} aria-current={period===p} onClick={()=>setPeriod(p)}>
                {p[0].toUpperCase()+p.slice(1)}
              </button>
            ))}
          </div>
          <div>
            {rows.map((r,i) => (
              <div key={r.name} className={"lb-row "+(medal[i]||"")}
                   style={r.isYou?{background:"#fbe7b833",borderRadius:10}:{}}>
                <div className="rk">{i<3?["🥇","🥈","🥉"][i]:"#"+(i+1)}</div>
                <div>
                  <div className="nm">{r.name} {r.isYou && <span style={{color:"var(--brand)",fontSize:11.5,marginLeft:6}}>● you</span>}</div>
                  <div className="meta">{tierFor(period==="monthly"?r.count:r.count*3).name}</div>
                </div>
                <div className="bar2"><i style={{width: Math.round(r.count/top*100)+"%"}}/></div>
                <div className="ct tabnum">{r.count}</div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ─── Confetti ─────────────────────────────────────────────────────────────
    function spawnConfetti(){
      const n = 6 + Math.floor(Math.random()*4);
      for (let i=0;i<n;i++){
        const el = document.createElement("div");
        el.className = "confetti";
        el.textContent = Math.random()<0.85 ? "💩" : "✨";
        el.style.left = (window.innerWidth/2 + (Math.random()-0.5)*120) + "px";
        el.style.top  = (window.innerHeight*0.35) + "px";
        el.style.setProperty("--dx", ((Math.random()-0.5)*400) + "px");
        el.style.setProperty("--rot", (Math.random()*720 - 360) + "deg");
        el.style.animationDelay = (i*40)+"ms";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 1400);
      }
    }

    // ─── Toast ────────────────────────────────────────────────────────────────
    function useToast(){
      const [msg, setMsg] = useState(null);
      const timer = useRef();
      const show = (m) => {
        clearTimeout(timer.current);
        setMsg(m);
        timer.current = setTimeout(()=>setMsg(null), 1800);
      };
      const node = msg ? <div className={"toast "+(msg?"show":"")}>{msg}</div> : null;
      return [show, node];
    }

    // ─── App ──────────────────────────────────────────────────────────────────
    function App(){
      const [log, setLog] = useState(loadLog);
      const [view, setView] = useState("home");
      const [viewDate, setViewDate] = useState(()=>new Date());
      const [toast, toastNode] = useToast();
      const [milestone, setMilestone] = useState(null); // { count, message }

      useEffect(()=> saveLog(log), [log]);

      // Re-render every 30s so relative times stay fresh
      const [, force] = useState(0);
      useEffect(()=>{ const id = setInterval(()=>force(x=>x+1), 30000); return ()=>clearInterval(id); },[]);

      const now = new Date();
      const todayCount = useMemo(()=> log.filter(ts => sameDay(ts, now)).length, [log, now.toDateString()]);
      const weekStart = startOfWeek(now).getTime();
      const weekCount = useMemo(()=> log.filter(ts => ts >= weekStart).length, [log, weekStart]);
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const monthCount = useMemo(()=> log.filter(ts => ts >= monthStart).length, [log, monthStart]);
      const allCount = log.length;

      const streakDays = useMemo(()=>{
        const set = new Set(log.map(ts => startOfDay(new Date(ts)).getTime()));
        let d = startOfDay(new Date()).getTime();
        let s = 0;
        if (!set.has(d)) d -= 86400000;
        while (set.has(d)){ s++; d -= 86400000; }
        return s;
      }, [log]);

      const monthlyCounts = useMemo(()=>{
        const y = viewDate.getFullYear(), m = viewDate.getMonth();
        const out = {};
        for (const ts of log){
          const d = new Date(ts);
          if (d.getFullYear()===y && d.getMonth()===m){
            out[d.getDate()] = (out[d.getDate()] || 0) + 1;
          }
        }
        return out;
      }, [log, viewDate]);

      const weeklyAvg = useMemo(()=>{
        const eightWeeks = Date.now() - 7*86400000*8;
        return log.filter(ts => ts >= eightWeeks).length / 8;
      }, [log]);

      const bestDay = useMemo(()=>{
        const byDay = {};
        for (const ts of log){
          const k = startOfDay(new Date(ts)).getTime();
          byDay[k] = (byDay[k]||0)+1;
        }
        let best = 0, bestK = null;
        for (const [k,v] of Object.entries(byDay)){
          if (v>best){ best=v; bestK=+k; }
        }
        return { count: best, date: bestK ? new Date(bestK) : null };
      }, [log]);

      const logPoop = useCallback(()=>{
        const ts = Date.now();
        setLog(prev => {
          const next = [...prev, ts];
          const newTodayCount = next.filter(t => sameDay(t, new Date())).length;

          // Check milestones (exact counts only)
          if (MILESTONES[newTodayCount]) {
            setTimeout(() => {
              setMilestone({ count: newTodayCount, message: pickRandom(MILESTONES[newTodayCount]) });
            }, 400);
          }
          return next;
        });
        spawnConfetti();
        const flavors = [
          "Logged. The throne remembers.",
          "+1 plop. Form: pristine.",
          "Plop registered. Mighty.",
          "Bowl bowed. Logged.",
          "Counter incremented. Hydrate.",
        ];
        toast(flavors[Math.floor(Math.random()*flavors.length)]);
      }, []);

      const undoLast = useCallback(()=>{
        setLog(prev => prev.length ? prev.slice(0,-1) : prev);
        toast("Undone. Never happened.");
      }, []);

      const deleteOne = useCallback((ts)=>{
        setLog(prev => prev.filter(x=>x!==ts));
        toast("Entry erased.");
      }, []);

      const resetAll = useCallback(()=>{
        if (confirm("Clear ALL plops? This cannot be undone.")){
          setLog([]);
          toast("All entries cleared.");
        }
      }, []);

      const reseed = useCallback(()=>{
        setLog(seedLog());
        toast("Demo data restored.");
      }, []);

      const prevMonth = () => setViewDate(d => new Date(d.getFullYear(), d.getMonth()-1, 1));
      const nextMonth = () => setViewDate(d => new Date(d.getFullYear(), d.getMonth()+1, 1));

      const stats = [
        { k:"Today",     v:todayCount, unit: todayCount===1?" plop":" plops" },
        { k:"This Week", v:weekCount },
        { k:"This Month",v:monthCount },
        { k:"All-time",  v:allCount  },
      ];

      return (
        <div className="shell">
          <header className="top">
            <div className="brand">
              <div className="brand-mark">💩</div>
              <div>
                <h1>The Royal Log</h1>
              </div>
            </div>
            <nav className="nav" role="tablist">
              {[["home","Today","💩"],["month","Month","📅"],["ranks","Ranks","🏆"]].map(([k,lbl,ico])=>(
                <button key={k} aria-current={view===k} onClick={()=>setView(k)}>
                  <span className="ti" aria-hidden="true">{ico}</span>
                  <span>{lbl}</span>
                  <span className="ti-dot"/>
                </button>
              ))}
            </nav>
          </header>

          {view==="home" && (
            <>
              <HeroCounter
                todayCount={todayCount}
                onLog={logPoop}
                onUndo={undoLast}
                canUndo={log.length>0}
                streakDays={streakDays}
                weeklyAvg={weeklyAvg}
              />
              <StatStrip stats={stats}/>
              <div className="grid two" style={{marginTop:18}}>
                <LogList log={log} onDelete={deleteOne} />
                <TierCard monthlyCount={monthCount} />
              </div>
            </>
          )}

          {view==="month" && (
            <div className="grid two">
              <CalendarMonth
                year={viewDate.getFullYear()}
                month={viewDate.getMonth()}
                counts={monthlyCounts}
                onPrev={prevMonth}
                onNext={nextMonth}
              />
              <div style={{display:"flex",flexDirection:"column",gap:18}}>
                <section className="card">
                  <h2>This month at a glance</h2>
                  <div className="sub">{monthLabel(viewDate)}</div>
                  <div className="stat-strip" style={{marginTop:6}}>
                    <div className="stat"><div className="k">Total</div><div className="v tabnum">{Object.values(monthlyCounts).reduce((a,b)=>a+b,0)}</div></div>
                    <div className="stat"><div className="k">Active days</div><div className="v tabnum">{Object.keys(monthlyCounts).length}</div></div>
                    <div className="stat"><div className="k">Best day</div><div className="v tabnum">{Math.max(0,...(Object.values(monthlyCounts).length?Object.values(monthlyCounts):[0]))}</div></div>
                    <div className="stat"><div className="k">Per day avg</div><div className="v tabnum">{
                      (Object.values(monthlyCounts).reduce((a,b)=>a+b,0) / new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate()).toFixed(2)
                    }</div></div>
                  </div>
                </section>
                <section className="card">
                  <h2>Best day ever</h2>
                  <div className="sub">A personal high-water mark.</div>
                  {bestDay.count
                    ? <div style={{display:"flex",alignItems:"center",gap:14}}>
                        <div className="tier-badge" style={{background:"linear-gradient(160deg,#e7c98a,#a06a2a)"}}>🏆</div>
                        <div>
                          <div className="tier-name tabnum">{bestDay.count} plops</div>
                          <div className="tier-flavor">{bestDay.date.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"})}</div>
                        </div>
                      </div>
                    : <div style={{color:"var(--ink-2)"}}>No plops on record yet.</div>}
                </section>
              </div>
            </div>
          )}

          {view==="ranks" && (
            <div className="grid two">
              <TierCard monthlyCount={monthCount} />
              <Leaderboard monthly={monthCount} weekly={weekCount} />
            </div>
          )}

          <div className="foot">
            Stored locally on your device. <a href="#" onClick={(e)=>{e.preventDefault(); resetAll();}}>Clear all</a> · <a href="#" onClick={(e)=>{e.preventDefault(); reseed();}}>Restore demo data</a>
          </div>

          <MilestoneModal
            count={milestone?.count}
            message={milestone?.message}
            onClose={() => setMilestone(null)}
          />

          {toastNode}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
