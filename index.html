<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Royal Log — Poop Counter</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f6f1e7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#f6f1e7; --cream-2:#efe7d6; --ink:#2b2118; --ink-2:#5a4a3a;
    --line:#e3d9c4; --brand:#8a5a2b; --brand-2:#6b3f17;
    --gold:#c8901c; --gold-soft:#f3d27a; --rose:#b34a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"DM Sans","Helvetica Neue",Helvetica,sans-serif;
    font-feature-settings:"ss01","cv11";
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none}
  body{min-height:100vh;min-height:100dvh}
  .display{font-family:"Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-0.02em;line-height:.95}
  .tabnum{font-variant-numeric:tabular-nums}

  .shell{max-width:480px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-top:env(safe-area-inset-top)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);flex-shrink:0;
    display:grid;place-items:center;color:var(--cream);font-family:"Bricolage Grotesque",sans-serif;
    font-weight:800;font-size:18px;letter-spacing:-.04em;
    box-shadow:0 2px 0 #00000020,inset 0 1px 0 #ffffff14}
  .brand h1{margin:0;font:800 18px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;justify-content:center;gap:32px;
    background:rgba(246,241,231,.92);
    -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid var(--line);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px #00000010}
  .nav button{appearance:none;border:0;background:transparent;color:var(--ink-2);
    font:600 11px/1.2 "DM Sans",sans-serif;padding:8px 0 4px;border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.02em}
  .nav button .ti{font-size:22px;line-height:1;filter:grayscale(.4) opacity(.7);transition:filter .15s,transform .15s}
  .nav button[aria-current="true"]{color:var(--ink)}
  .nav button[aria-current="true"] .ti{filter:none;transform:translateY(-1px)}
  .nav button[aria-current="true"] .ti-dot{display:block}
  .ti-dot{display:none;width:5px;height:5px;border-radius:99px;background:var(--brand);margin-top:1px}
  @media (min-width:780px){
    .shell{max-width:1180px;padding:28px 28px 80px}
    .top{margin-bottom:18px;padding-top:0}
    .grid.two{grid-template-columns:1.15fr .85fr}
    .nav{position:static;gap:4px;background:#0000000a;padding:4px;border-radius:12px;border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
    .nav button{flex-direction:row;font-size:13px;padding:8px 14px;border-radius:9px;gap:6px}
    .nav button .ti{font-size:14px;filter:none}
    .nav button[aria-current="true"]{background:var(--cream);box-shadow:0 1px 0 #00000010,0 1px 4px #0000000d;border:1px solid var(--line)}
    .ti-dot{display:none !important}
  }

  .grid{display:grid;gap:14px}
  .grid.two{grid-template-columns:1fr}
  @media (min-width:780px){.grid{gap:18px}}

  .card{background:#fffdf7;border:1px solid var(--line);border-radius:18px;padding:18px;
    box-shadow:0 1px 0 #ffffff inset,0 2px 0 #00000005}
  .card h2{margin:0 0 4px;font:700 17px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
  .card .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:12px}
  @media (min-width:780px){.card{padding:22px}.card h2{font-size:18px}}

  .hero{position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%,#fbe7b8 0%,transparent 60%),linear-gradient(180deg,#fffdf7 0%,#fcf6e7 100%);
    padding:22px 20px 24px;text-align:center}
  .hero .row{display:flex;flex-direction:column;align-items:center;gap:6px}
  .today-label{font:600 11px/1 "DM Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
  .today-num{font:800 88px/.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-top:6px}
  .today-num small{font:600 14px/1 "DM Sans",sans-serif;color:var(--ink-2);margin-left:6px;letter-spacing:0;vertical-align:middle}
  .streak{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-size:12.5px;margin-top:10px}
  .streak b{color:var(--ink)}
  @media (min-width:780px){
    .hero{padding:30px 26px 26px;text-align:left}
    .hero .row{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:16px}
    .today-num{font-size:96px;margin-top:8px}
    .streak{justify-content:flex-start;font-size:13px;margin-top:14px}
  }

  .plop-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
  .plop{appearance:none;border:0;cursor:pointer;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#b07a45 0%,#7a4a1f 55%,#4f2d10 100%);
    color:#fff;font:800 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;
    box-shadow:inset 0 -10px 24px #00000055,inset 0 8px 18px #ffffff22,0 18px 28px -8px #6b3f1755,0 4px 0 #4f2d10;
    transition:transform .08s ease,box-shadow .08s ease,filter .12s;
    display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .plop:hover{filter:brightness(1.04)}
  .plop:active{transform:translateY(3px);box-shadow:inset 0 -6px 18px #00000055,inset 0 6px 14px #ffffff22,0 8px 18px -6px #6b3f1755,0 1px 0 #4f2d10}
  .plop .glyph{font-size:56px;line-height:1;display:block;margin-bottom:4px;filter:drop-shadow(0 2px 0 #00000033)}
  .plop .lbl{display:block;text-shadow:0 1px 0 #00000044}
  @media (min-width:780px){.plop{width:200px;height:200px;font-size:22px}.plop .glyph{font-size:64px}}

  .undo{appearance:none;background:transparent;border:1px dashed #00000033;color:var(--ink-2);
    padding:8px 14px;border-radius:99px;font:600 12px/1 "DM Sans";cursor:pointer;min-height:36px}
  .undo:hover{background:#00000008;color:var(--ink)}

  .stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .stat{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .stat .k{font:600 10px/1 "DM Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .stat .v{font:800 24px/1 "Bricolage Grotesque",sans-serif;margin-top:6px;letter-spacing:-.02em}
  .stat .v small{font:600 11px/1 "DM Sans";color:var(--ink-2);margin-left:4px;letter-spacing:0}
  @media (min-width:780px){.stat-strip{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.stat{padding:12px 14px}.stat .v{font-size:26px}}

  .tier{display:flex;align-items:center;gap:12px}
  .tier-badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;
    background:linear-gradient(160deg,#fbe7b8 0%,#c8901c 100%);flex-shrink:0;
    box-shadow:inset 0 1px 0 #ffffff80,0 2px 0 #0000001a}
  .tier-name{font:800 19px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
  .tier-flavor{color:var(--ink-2);font-size:12.5px;margin-top:4px}
  .tier-progress{margin-top:14px}
  .bar{height:10px;background:#0000000d;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand) 0%,var(--gold) 100%);border-radius:99px}
  .tier-progress .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);margin-top:6px}
  .tier-ladder{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .rung{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent}
  .rung.active{background:#fbe7b833;border-color:#e7c777}
  .rung .ico{font-size:20px;text-align:center}
  .rung .nm{font-weight:700;font-size:13px}
  .rung .rg{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.3}
  .rung .num{font:700 11px/1 "JetBrains Mono",monospace;color:var(--ink-2);padding:4px 8px;border-radius:99px;background:#00000008}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font:600 10px/1 "DM Sans";text-align:center;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;padding-bottom:4px}
  .cell{aspect-ratio:1;border-radius:8px;background:#00000008;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:space-between;padding:4px 5px;border:1px solid transparent;min-width:0}
  .cell.empty{background:transparent;border:0}
  .cell.today{border-color:var(--ink)}
  .cell .d{font-weight:600;color:var(--ink);opacity:.65;font-size:10px}
  .cell .c{font-weight:800;font-size:12px;font-family:"Bricolage Grotesque",sans-serif;color:#fff;line-height:1;align-self:flex-end}
  .cell[data-h="0"]{background:#0000000a} .cell[data-h="1"]{background:#e7c98a}
  .cell[data-h="2"]{background:#d6a655}   .cell[data-h="3"]{background:#a06a2a}
  .cell[data-h="4"]{background:#6b3f17}
  .cell[data-h="0"] .c{color:transparent}
  .cell[data-h="1"] .c,.cell[data-h="2"] .c{color:#2b2118}

  .month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .month-head h2{margin:0}
  .month-nav{display:flex;align-items:center;gap:4px}
  .month-nav button{appearance:none;border:1px solid var(--line);background:#fffdf7;width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px;line-height:1;-webkit-tap-highlight-color:transparent}
  .month-nav button:hover{background:#fbe7b855}
  .month-nav .lbl{padding:0 6px;font-weight:700;font-size:13px;text-align:center}

  .log{display:flex;flex-direction:column;gap:0}
  .log-group{font:600 10px/1 "DM Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .log-group:first-child{margin-top:0}
  .log-group b{color:var(--ink);font-size:12px;letter-spacing:0;text-transform:none;font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
  .log-item{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:9px 2px;border-top:1px dashed var(--line)}
  .log-item:first-of-type{border-top:0}
  .log-item .pip{font-size:16px;width:28px;text-align:center}
  .log-item .time{font:600 14px/1 "DM Sans"}
  .log-item .rel{font:500 11px/1 "JetBrains Mono",monospace;color:var(--ink-2);margin-top:3px}
  .log-item .tag{font:600 9.5px/1 "DM Sans";letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px;background:#00000008;color:var(--ink-2);white-space:nowrap}
  .log-item .del{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;width:32px;height:32px;border-radius:8px;font-size:16px;opacity:.5;-webkit-tap-highlight-color:transparent}
  .log-item .del:hover{background:#0000000a;color:var(--rose);opacity:1}
  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-2)}
  .empty-state .big{font-size:38px;margin-bottom:8px}
  .empty-state h3{margin:0 0 4px;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;color:var(--ink)}

  /* leaderboard */
  .lb-tabs{display:inline-flex;background:#0000000a;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
  .lb-tabs button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:600 12px/1 "DM Sans";padding:8px 14px;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lb-tabs button[aria-current="true"]{background:#fffdf7;color:var(--ink);border:1px solid var(--line)}
  .lb-row{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px dashed var(--line)}
  .lb-row:first-of-type{border-top:0}
  .lb-row.me{background:#fbe7b833;border-radius:10px;padding:10px 8px;margin:0 -4px}
  .lb-row .rk{font:800 13px/1 "Bricolage Grotesque";color:var(--ink-2);text-align:center}
  .lb-row.gold .rk{color:var(--gold)} .lb-row.silver .rk{color:#9aa0a6} .lb-row.bronze .rk{color:#b56a2a}
  .lb-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line)}
  .lb-avatar-fallback{width:32px;height:32px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font:700 13px/1 "DM Sans";color:#fff;border:1.5px solid var(--line);flex-shrink:0}
  .lb-row .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-row .lb-tier{font-size:11px;color:var(--ink-2);margin-top:2px}
  .lb-row .ct{font:800 20px/1 "Bricolage Grotesque";min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
  .lb-empty{padding:30px 10px;text-align:center;color:var(--ink-2)}
  .lb-empty .big{font-size:38px;margin-bottom:8px}

  .foot{margin-top:18px;color:var(--ink-2);font-size:11.5px;text-align:center}
  .foot a{color:inherit}

  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  .confetti{position:fixed;pointer-events:none;font-size:28px;animation:drop 1.1s ease-in forwards;z-index:9999}
  @keyframes drop{0%{transform:translate(0,-20px) rotate(0deg);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx,0px),70vh) rotate(var(--rot,360deg));opacity:0}}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:99px;
    font:600 13px/1 "DM Sans";box-shadow:0 8px 24px #0000003a;z-index:9998;
    opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media (min-width:780px){.toast{bottom:30px}}

  /* modals */
  .modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(43,33,24,.6);
    -webkit-backdrop-filter:blur(8px) saturate(120%);backdrop-filter:blur(8px) saturate(120%);
    display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-box{background:#fffdf7;border:1px solid var(--line);border-radius:24px;padding:32px 28px 28px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 24px 80px #00000040,0 1px 0 #ffffff inset;animation:slideUp .25s cubic-bezier(.2,1.4,.4,1)}
  @keyframes slideUp{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .modal-emoji{font-size:64px;line-height:1;margin-bottom:16px;animation:wobble .6s cubic-bezier(.2,1.4,.4,1)}
  @keyframes wobble{0%{transform:scale(.6) rotate(-10deg)}50%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0deg)}}
  .modal-msg{font:700 17px/1.45 "DM Sans",sans-serif;color:var(--ink);margin:0 0 24px}
  .modal-btn{appearance:none;border:0;cursor:pointer;background:var(--ink);color:var(--cream);font:700 14px/1 "DM Sans",sans-serif;
    padding:14px 32px;border-radius:99px;box-shadow:0 4px 0 #00000033,0 8px 20px #00000020;
    transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
  .modal-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #00000033,0 4px 10px #00000020}

  /* nickname setup */
  .nick-input{appearance:none;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;
    background:#fff;font:600 16px/1 "DM Sans",sans-serif;color:var(--ink);outline:none;
    margin-bottom:8px;text-align:center;transition:border-color .15s}
  .nick-input:focus{border-color:var(--brand)}
  .nick-input::placeholder{color:var(--ink-2);font-weight:400}
  .nick-error{font-size:12px;color:var(--rose);margin-bottom:16px;min-height:16px}
  .nick-hint{font-size:12px;color:var(--ink-2);margin-bottom:20px}

  /* login */
  .login-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream)}
  .login-card{background:#fffdf7;border:1px solid var(--line);border-radius:28px;padding:40px 32px 36px;max-width:360px;width:100%;text-align:center;box-shadow:0 2px 0 #00000005,0 1px 0 #ffffff inset}
  .login-icon{font-size:72px;line-height:1;margin-bottom:20px;display:block}
  .login-title{font:800 28px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 8px}
  .login-sub{color:var(--ink-2);font-size:14px;line-height:1.5;margin:0 0 32px}
  .google-btn{appearance:none;border:1px solid var(--line);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;border-radius:14px;
    font:600 15px/1 "DM Sans",sans-serif;color:var(--ink);
    box-shadow:0 1px 0 #00000008,0 2px 8px #00000008;transition:box-shadow .15s,transform .1s;-webkit-tap-highlight-color:transparent}
  .google-btn:hover{box-shadow:0 2px 12px #00000014;transform:translateY(-1px)}
  .google-btn svg{width:20px;height:20px;flex-shrink:0}

  .loading-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
  .loading-emoji{font-size:48px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
  .loading-text{font:600 14px/1 "DM Sans";color:var(--ink-2)}

  /* user menu */
  .user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;object-fit:cover;flex-shrink:0;-webkit-tap-highlight-color:transparent}
  .user-avatar-fallback{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--brand);display:grid;place-items:center;font-size:15px;color:#fff;font-weight:700;cursor:pointer;flex-shrink:0}
  .user-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:100;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:200px;box-shadow:0 8px 32px #00000018,0 1px 0 #ffffff inset}
  .user-menu-name{padding:8px 10px 2px;font:600 13px/1.3 "DM Sans";color:var(--ink)}
  .user-menu-nick{padding:2px 10px 8px;font-size:11px;color:var(--ink-2);border-bottom:1px solid var(--line);margin-bottom:6px}
  .user-menu-nick span{color:var(--brand);font-weight:600}
  .user-menu-btn{appearance:none;border:0;background:transparent;cursor:pointer;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font:600 13px/1 "DM Sans";color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .user-menu-btn:hover{background:#00000008;color:var(--ink)}
  .user-menu-btn.danger{color:var(--rose)}
  .user-menu-btn.danger:hover{background:#b34a3a11}
  .user-wrap{position:relative}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
  const { useState, useEffect, useMemo, useRef, useCallback } = React;

  // ─── Milestones ────────────────────────────────────────────────────────────
  const MILESTONES = {
    3: ["Three times today? Wow, an elite digestive system. A true poop champion.","Three times? Your metabolism is working overtime, huh?","Three poops a day? Look at you, Mr./Ms. Efficient Digestion!","Three rounds already? Are you trying to set a local record or what?","Three times? Honestly, I'm kind of jealous of your fast-track stomach."],
    5: ["Five times?! Is your asshole okay, or is it calling for backup?","Five rounds? Seriously, is everything okay down there?","Five times? At this point, you should just move your bed into the toilet."],
    7: ["Seven times? Buddy, are you sure you're alive? Do we need to go to the ER?","Seven times? Are you pooping out your past mistakes too?"],
    10: ["Ten times?! Do you even have a colon, or is your throat connected straight to your butt?","Achievement Unlocked: 10 Shits. Reward: A lifetime supply of hemorrhoid cream."],
  };
  const MILESTONE_EMOJIS = { 3:"💩", 5:"🚨", 7:"😱", 10:"🏆" };
  const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ─── Tiers ─────────────────────────────────────────────────────────────────
  const TIERS = [
    { key:"dormant",  ico:"🌱", name:"Dormant Cheeks",   min:0,  flavor:"Patience. Greatness ferments." },
    { key:"bronze",   ico:"🥉", name:"Bronze Bowel",      min:1,  flavor:"Off the mark, into the bowl." },
    { key:"silver",   ico:"🥈", name:"Silver Squatter",   min:8,  flavor:"Reliable. Punctual. Respectable." },
    { key:"gold",     ico:"🥇", name:"Gold Plopper",      min:16, flavor:"Olympic-tier intestinal flora." },
    { key:"platinum", ico:"💎", name:"Platinum Pipework", min:26, flavor:"Smooth operator. Frictionless." },
    { key:"royal",    ico:"👑", name:"Royal Flusher",     min:36, flavor:"Subjects bow as you exit the WC." },
    { key:"legend",   ico:"🐉", name:"Mythic Mudslinger", min:50, flavor:"Spoken of in hushed bathroom tones." },
  ];
  const tierFor = (n) => TIERS.slice().reverse().find(t => n >= t.min) || TIERS[0];
  const nextTier = (n) => TIERS.find(t => n < t.min);

  const TAGS = ["📰 Reader","⚡ Quickie","🧘 Meditative","☕ Post-coffee","🌙 Midnight","🚀 Express","🎧 Podcast","🧗 Climber"];
  const tagFor = (ts) => TAGS[(Math.floor(ts/60000)) % TAGS.length];

  // ─── Date helpers ──────────────────────────────────────────────────────────
  const startOfDay = (d) => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
  const sameDay = (a,b) => startOfDay(a).getTime()===startOfDay(b).getTime();
  const monthLabel = (d) => d.toLocaleString(undefined,{month:"long",year:"numeric"});
  const fmtTime = (d) => d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const relTime = (ts) => {
    const s=(Date.now()-ts)/1000;
    if(s<60) return `${Math.max(1,Math.floor(s))}s ago`;
    if(s<3600) return `${Math.floor(s/60)}m ago`;
    if(s<86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  };
  const startOfWeek = (d) => { const x=startOfDay(d); x.setDate(x.getDate()-x.getDay()); return x; };
  const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

  // ─── Firebase ──────────────────────────────────────────────────────────────
  const db = firebase.firestore();
  const auth = firebase.auth();

  const saveUserLog = (uid, log) =>
    db.collection("users").doc(uid).set({ log }, { merge: true });

  const updateLeaderboard = (uid, nickname, photoURL, log) => {
    const now = new Date();
    const mKey = monthKey(now);
    const wStart = startOfWeek(now).getTime();
    const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    db.collection("leaderboard").doc(uid).set({
      displayName: nickname,
      photoURL: photoURL || null,
      monthlyCount: log.filter(ts => ts >= mStart).length,
      weeklyCount:  log.filter(ts => ts >= wStart).length,
      monthKey: mKey,
      weekStart: wStart,
      updatedAt: Date.now(),
    });
  };

  // ─── Nickname Setup Modal ──────────────────────────────────────────────────
  function NicknameModal({ uid, photoURL, log, onSave, title, subtitle, initial = "" }) {
    const [value, setValue] = useState(initial);
    const [error, setError] = useState("");
    const [saving, setSaving] = useState(false);
    const inputRef = useRef();
    useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

    const handle = async () => {
      const trimmed = value.trim();
      if (trimmed.length < 2) { setError("At least 2 characters please!"); return; }
      if (trimmed.length > 20) { setError("Max 20 characters."); return; }
      setSaving(true);
      await db.collection("users").doc(uid).set({ nickname: trimmed }, { merge: true });
      updateLeaderboard(uid, trimmed, photoURL, log || []);
      onSave(trimmed);
    };

    const handleKey = (e) => { if (e.key === "Enter") handle(); };

    return (
      <div className="modal-overlay">
        <div className="modal-box">
          <div className="modal-emoji">💩</div>
          <h2 style={{margin:"0 0 8px",font:'800 22px/1.1 "Bricolage Grotesque",sans-serif',letterSpacing:"-.01em"}}>{title}</h2>
          <p style={{color:"var(--ink-2)",fontSize:13,margin:"0 0 20px",lineHeight:1.5}}>{subtitle}</p>
          <input
            ref={inputRef}
            className="nick-input"
            type="text"
            placeholder="e.g. PoopKing69"
            value={value}
            maxLength={20}
            onChange={e=>{setValue(e.target.value);setError("");}}
            onKeyDown={handleKey}
          />
          <div className="nick-error">{error}</div>
          <button className="modal-btn" onClick={handle} disabled={saving} style={{width:"100%"}}>
            {saving ? "Saving…" : "Save nickname"}
          </button>
        </div>
      </div>
    );
  }

  // ─── Login Screen ──────────────────────────────────────────────────────────
  function LoginScreen() {
    const [loading, setLoading] = useState(false);
    const signIn = async () => {
      setLoading(true);
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch(e) { setLoading(false); }
    };
    return (
      <div className="login-screen">
        <div className="login-card">
          <span className="login-icon">💩</span>
          <h1 className="login-title">The Royal Log</h1>
          <p className="login-sub">Track your throne sessions.<br/>Your data syncs across all devices.</p>
          <button className="google-btn" onClick={signIn} disabled={loading}>
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            {loading ? "Signing in…" : "Sign in with Google"}
          </button>
        </div>
      </div>
    );
  }

  function LoadingScreen() {
    return (
      <div className="loading-screen">
        <div className="loading-emoji">💩</div>
        <div className="loading-text">Loading your logs…</div>
      </div>
    );
  }

  // ─── User Menu ─────────────────────────────────────────────────────────────
  function UserMenu({ user, nickname, onChangeNickname }) {
    const [open, setOpen] = useState(false);
    const ref = useRef();
    useEffect(() => {
      const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener("mousedown", h);
      document.addEventListener("touchstart", h);
      return () => { document.removeEventListener("mousedown", h); document.removeEventListener("touchstart", h); };
    }, []);
    const close = () => setOpen(false);
    return (
      <div className="user-wrap" ref={ref}>
        {user.photoURL
          ? <img className="user-avatar" src={user.photoURL} alt="" onClick={()=>setOpen(o=>!o)} referrerPolicy="no-referrer"/>
          : <div className="user-avatar-fallback" onClick={()=>setOpen(o=>!o)}>{(nickname||user.email||"?")[0].toUpperCase()}</div>
        }
        {open && (
          <div className="user-menu">
            <div className="user-menu-name">{user.displayName || user.email}</div>
            <div className="user-menu-nick">Throne name: <span>{nickname}</span></div>
            <button className="user-menu-btn" onClick={()=>{close();onChangeNickname();}}>✏️ Change nickname</button>
            <button className="user-menu-btn danger" onClick={()=>auth.signOut()}>↩ Sign out</button>
          </div>
        )}
      </div>
    );
  }

  // ─── Milestone Modal ───────────────────────────────────────────────────────
  function MilestoneModal({ count, message, onClose }) {
    if (!message) return null;
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={e=>e.stopPropagation()}>
          <div className="modal-emoji">{MILESTONE_EMOJIS[count]||"💩"}</div>
          <p className="modal-msg">{message}</p>
          <button className="modal-btn" onClick={onClose}>Got it 💪</button>
        </div>
      </div>
    );
  }

  // ─── Hero Counter ──────────────────────────────────────────────────────────
  function HeroCounter({ todayCount, onLog, onUndo, canUndo, streakDays, weeklyAvg }) {
    const [pop, setPop] = useState(0);
    const handle = () => { onLog(); setPop(p=>p+1); };
    return (
      <section className="card hero">
        <div className="row">
          <div>
            <div className="today-label">Today's log</div>
            <div className={"today-num display tabnum "+(pop?"pop":"")} key={"n-"+todayCount} onAnimationEnd={()=>setPop(0)}>
              {todayCount}<small>{todayCount===1?"plop":"plops"}</small>
            </div>
            <div className="streak">
              <span>🔥 <b>{streakDays}-day</b> streak</span>
              <span style={{opacity:.4}}>·</span>
              <span>Avg <b>{weeklyAvg.toFixed(1)}/wk</b></span>
            </div>
          </div>
          <div className="plop-wrap">
            <button className="plop" onClick={handle} aria-label="Log a poop">
              <span className="glyph">💩</span>
              <span className="lbl">Log a Plop</span>
            </button>
            <button className="undo" onClick={onUndo} disabled={!canUndo} style={{opacity:canUndo?1:.4,cursor:canUndo?"pointer":"default"}}>↶ Undo last</button>
          </div>

  }

  // ─── Stat Strip ────────────────────────────────────────────────────────────
  function StatStrip({ stats }) {
    return (
      <div className="stat-strip">
        {stats.map(s=>(
          <div className="stat" key={s.k}>
            <div className="k">{s.k}</div>
            <div className="v tabnum">{s.v}<small>{s.unit||""}</small></div>
          </div>
        ))}
      </div>
    );
  }

  // ─── Tier Card ─────────────────────────────────────────────────────────────
  function TierCard({ monthlyCount }) {
    const t = tierFor(monthlyCount);
    const nxt = nextTier(monthlyCount);
    const pct = nxt ? Math.min(100,Math.round((monthlyCount-t.min)/(nxt.min-t.min)*100)) : 100;
    return (
      <section className="card">
        <h2>Current rank</h2>
        <div className="sub">Based on this month's count</div>
        <div className="tier">
          <div className="tier-badge">{t.ico}</div>
          <div><div className="tier-name">{t.name}</div><div className="tier-flavor">"{t.flavor}"</div></div>
        </div>
        <div className="tier-progress">
          <div className="bar"><i style={{width:pct+"%"}}/></div>
          <div className="meta">
            <span>{monthlyCount} this month</span>
            <span>{nxt?`${nxt.min-monthlyCount} to ${nxt.name} ${nxt.ico}`:"Max tier reached 🐉"}</span>
          </div>
        </div>
        <div className="tier-ladder" style={{marginTop:18}}>
          {TIERS.map(rung=>(
            <div key={rung.key} className={"rung "+(rung.key===t.key?"active":"")}>
              <div className="ico">{rung.ico}</div>
              <div><div className="nm">{rung.name}</div><div className="rg">{rung.flavor}</div></div>
              <div className="num tabnum">{rung.min}+</div>
            </div>
          ))}
        </div>
      </section>
    );
  }

  // ─── Calendar Heatmap ──────────────────────────────────────────────────────
  function CalendarMonth({ year, month, counts, onPrev, onNext }) {
    const first = new Date(year,month,1);
    const daysIn = new Date(year,month+1,0).getDate();
    const cells = [];
    for(let i=0;i<first.getDay();i++) cells.push({empty:true,k:"e"+i});
    for(let d=1;d<=daysIn;d++){
      const date=new Date(year,month,d);
      cells.push({d,c:counts[d]||0,date,today:sameDay(date,new Date()),k:"d"+d});
    }
    while(cells.length%7!==0) cells.push({empty:true,k:"t"+cells.length});
    const heat=(c)=>c===0?0:c<=1?1:c<=2?2:c<=3?3:4;
    const monthTotal=Object.values(counts).reduce((a,b)=>a+b,0);
    return (
      <section className="card">
        <div className="month-head">
          <div>
            <h2>{monthLabel(first)}</h2>
            <div className="sub" style={{margin:0}}>{monthTotal} total · {(monthTotal/daysIn).toFixed(2)} per day avg</div>
          </div>
          <div className="month-nav">
            <button onClick={onPrev}>←</button>
            <span className="lbl">{monthLabel(first)}</span>
            <button onClick={onNext}>→</button>
          </div>
        </div>
        <div className="cal" style={{marginBottom:8}}>
          {["S","M","T","W","T","F","S"].map((x,i)=><div className="dow" key={i}>{x}</div>)}
        </div>
        <div className="cal">
          {cells.map(c=>c.empty
            ?<div className="cell empty" key={c.k}/>
            :<div className={"cell"+(c.today?" today":"")} data-h={heat(c.c)} key={c.k} title={`${c.c} plops`}>
              <div className="d">{c.d}</div><div className="c">{c.c||""}</div>
            </div>
          )}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:14,fontSize:11.5,color:"var(--ink-2)"}}>
          <span>Less</span>
          {[0,1,2,3,4].map(h=><span key={h} data-h={h} className="cell" style={{width:18,height:18,aspectRatio:"auto",padding:0,borderRadius:5}}/>)}
          <span>More</span>
        </div>
      </section>
    );
  }

  // ─── Log List ──────────────────────────────────────────────────────────────
  function LogList({ log, onDelete }) {
    if(!log.length) return (
      <section className="card">
        <h2>Recent activity</h2>
        <div className="empty-state">
          <div className="big">🚽</div>
          <h3>No plops on record</h3>
          <div>Tap the big brown button when nature calls.</div>
        </div>
      </section>
    );
    const groups=[];
    const sorted=log.slice().sort((a,b)=>b-a);
    let cur=null;
    for(const ts of sorted){
      const k=startOfDay(new Date(ts)).getTime();
      if(k!==cur){cur=k;groups.push({k,items:[]});}
      groups[groups.length-1].items.push(ts);
    }
    const todayMs=startOfDay(new Date()).getTime(), yMs=todayMs-86400000;
    const dayLabel=(k)=>k===todayMs?"Today":k===yMs?"Yesterday":new Date(k).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
    return (
      <section className="card">
        <h2>Recent activity</h2>
        <div className="sub">Newest first. Tap × to remove a mis-tap.</div>
        <div className="log">
          {groups.slice(0,8).map(g=>(
            <React.Fragment key={g.k}>
              <div className="log-group"><b>{dayLabel(g.k)}</b><span>{g.items.length} {g.items.length===1?"plop":"plops"}</span></div>
              {g.items.map(ts=>(
                <div className="log-item" key={ts}>
                  <div className="pip">💩</div>
                  <div><div className="time">{fmtTime(new Date(ts))}</div><div className="rel">{relTime(ts)}</div></div>
                  <div className="tag">{tagFor(ts)}</div>
                  <button className="del" onClick={()=>onDelete(ts)}>×</button>
                </div>
              ))}
            </React.Fragment>
          ))}
        </div>
      </section>
    );
  }

  // ─── Hall of Plops ─────────────────────────────────────────────────────────
  function HallOfPlops({ myUid }) {
    const [period, setPeriod] = useState("monthly");
    const [rows, setRows] = useState([]);
    const [loading, setLoading] = useState(true);
    useEffect(() => {
      return db.collection("leaderboard").onSnapshot(snap => {
        const now = new Date();
        const curMonthKey = monthKey(now);
        const curWeekStart = startOfWeek(now).getTime();
        const data = snap.docs.map(doc => {
          const d = doc.data();
          return {
            uid: doc.id,
            displayName: d.displayName || "Anonymous",
            photoURL: d.photoURL || null,
            monthlyCount: d.monthKey === curMonthKey ? (d.monthlyCount||0) : 0,
            weeklyCount:  d.weekStart === curWeekStart ? (d.weeklyCount||0) : 0,
          };
        });
        setRows(data);
        setLoading(false);
      });
    }, []);

    const sorted = rows.slice().sort((a,b)=>period==="monthly"?b.monthlyCount-a.monthlyCount:b.weeklyCount-a.weeklyCount);
    const medals = ["gold","silver","bronze"];
    const medalIco = ["🥇","🥈","🥉"];

    return (
      <section className="card">
        <h2>Hall of Plops 🏆</h2>
        <div className="sub">Every throne has its champion.</div>
        <div className="lb-tabs" role="tablist">
          {["weekly","monthly"].map(p=>(
            <button key={p} aria-current={period===p} onClick={()=>setPeriod(p)}>
              {p[0].toUpperCase()+p.slice(1)}
            </button>
          ))}
        </div>
        {loading && <div style={{color:"var(--ink-2)",fontSize:13,padding:"10px 0"}}>Loading…</div>}
        {!loading && sorted.length===0 && (
          <div className="lb-empty"><div className="big">🚽</div><div>No one on the board yet.</div></div>
        )}
        {!loading && sorted.map((r,i)=>{
          const count = period==="monthly"?r.monthlyCount:r.weeklyCount;
          const isMe = r.uid===myUid;
          return (
            <div key={r.uid} className={"lb-row "+(medals[i]||"")+(isMe?" me":"")}>
              <div className="rk">{i<3?medalIco[i]:"#"+(i+1)}</div>
              {r.photoURL
                ?<img className="lb-avatar" src={r.photoURL} alt="" referrerPolicy="no-referrer"/>
                :<div className="lb-avatar-fallback">{(r.displayName||"?")[0].toUpperCase()}</div>
              }
              <div style={{minWidth:0}}>
                <div className="nm">{r.displayName}{isMe&&<span style={{color:"var(--brand)",fontSize:10.5,marginLeft:6,fontWeight:600}}>● you</span>}</div>
                <div className="lb-tier">{tierFor(period==="monthly"?r.monthlyCount:r.weeklyCount*4).name}</div>
              </div>
              <div className="ct tabnum">{count}</div>
            </div>
          );
        })}
      </section>
    );
  }

  // ─── Confetti ──────────────────────────────────────────────────────────────
  function spawnConfetti(){
    for(let i=0;i<8;i++){
      const el=document.createElement("div"); el.className="confetti";
      el.textContent=Math.random()<0.85?"💩":"✨";
      el.style.left=(window.innerWidth/2+(Math.random()-.5)*120)+"px";
      el.style.top=(window.innerHeight*.35)+"px";
      el.style.setProperty("--dx",((Math.random()-.5)*400)+"px");
      el.style.setProperty("--rot",(Math.random()*720-360)+"deg");
      el.style.animationDelay=(i*40)+"ms";
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1400);
    }
  }

  function useToast(){
    const [msg,setMsg]=useState(null);
    const timer=useRef();
    const show=(m)=>{clearTimeout(timer.current);setMsg(m);timer.current=setTimeout(()=>setMsg(null),1800);};
    return [show, msg?<div className="toast show">{msg}</div>:null];
  }

  // ─── App ───────────────────────────────────────────────────────────────────
  function App(){
    const [user,setUser]=useState(undefined);       // undefined=loading, null=logged out
    const [nickname,setNickname]=useState(undefined); // undefined=loading, null=not set yet
    const [log,setLog]=useState([]);
    const [view,setView]=useState("home");
    const [viewDate,setViewDate]=useState(()=>new Date());
    const [toast,toastNode]=useToast();
    const [milestone,setMilestone]=useState(null);
    const [editingNickname,setEditingNickname]=useState(false);
    const uid=user?.uid;

    // Auth listener
    useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u||null);if(!u) setNickname(undefined);}),[]);

    // Subscribe to user doc — loads log + nickname
    useEffect(()=>{
      if(!uid) return;
      return db.collection("users").doc(uid).onSnapshot(snap=>{
        if(snap.exists()){
          const data=snap.data();
          setLog(data.log||[]);
          setNickname(data.nickname||null);
        } else {
          setLog([]);
          setNickname(null);
        }
      });
    },[uid]);

    const [,force]=useState(0);
    useEffect(()=>{const id=setInterval(()=>force(x=>x+1),30000);return()=>clearInterval(id);},[]);

    const now=new Date();
    const todayCount=useMemo(()=>log.filter(ts=>sameDay(ts,now)).length,[log,now.toDateString()]);
    const weekStart=startOfWeek(now).getTime();
    const weekCount=useMemo(()=>log.filter(ts=>ts>=weekStart).length,[log,weekStart]);
    const monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    const monthCount=useMemo(()=>log.filter(ts=>ts>=monthStart).length,[log,monthStart]);

    const streakDays=useMemo(()=>{
      const set=new Set(log.map(ts=>startOfDay(new Date(ts)).getTime()));
      let d=startOfDay(new Date()).getTime(),s=0;
      if(!set.has(d)) d-=86400000;
      while(set.has(d)){s++;d-=86400000;}
      return s;
    },[log]);

    const weeklyAvg=useMemo(()=>log.filter(ts=>ts>=Date.now()-7*86400000*8).length/8,[log]);

    const monthlyCounts=useMemo(()=>{
      const y=viewDate.getFullYear(),m=viewDate.getMonth(),out={};
      for(const ts of log){const d=new Date(ts);if(d.getFullYear()===y&&d.getMonth()===m) out[d.getDate()]=(out[d.getDate()]||0)+1;}
      return out;
    },[log,viewDate]);

    const bestDay=useMemo(()=>{
      const byDay={};
      for(const ts of log){const k=startOfDay(new Date(ts)).getTime();byDay[k]=(byDay[k]||0)+1;}
      let best=0,bestK=null;
      for(const [k,v] of Object.entries(byDay)){if(v>best){best=v;bestK=+k;}}
      return {count:best,date:bestK?new Date(bestK):null};
    },[log]);

    const mutate=useCallback((nextLog)=>{
      saveUserLog(uid,nextLog);
      if(nickname) updateLeaderboard(uid,nickname,user.photoURL,nextLog);
    },[uid,nickname,user]);

    const logPoop=useCallback(()=>{
      if(!uid) return;
      const ts=Date.now();
      setLog(prev=>{
        const next=[...prev,ts];
        const newTodayCount=next.filter(t=>sameDay(t,new Date())).length;
        if(MILESTONES[newTodayCount]) setTimeout(()=>setMilestone({count:newTodayCount,message:pickRandom(MILESTONES[newTodayCount])}),400);
        mutate(next);
        return next;
      });
      spawnConfetti();
      toast(pickRandom(["Logged. The throne remembers.","Plop registered. Mighty.","Bowl bowed. Logged.","Counter incremented. Hydrate.","+1 plop. Form: pristine."]));
    },[uid,mutate]);

    const undoLast=useCallback(()=>{
      if(!uid) return;
      setLog(prev=>{const next=prev.length?prev.slice(0,-1):prev;mutate(next);return next;});
      toast("Undone. Never happened.");
    },[uid,mutate]);

    const deleteOne=useCallback((ts)=>{
      if(!uid) return;
      setLog(prev=>{const next=prev.filter(x=>x!==ts);mutate(next);return next;});
      toast("Entry erased.");
    },[uid,mutate]);

    const resetAll=useCallback(()=>{
      if(!uid) return;
      if(confirm("Clear ALL plops? This cannot be undone.")){
        setLog([]);mutate([]);toast("All entries cleared.");
      }
    },[uid,mutate]);

    const handleNicknameSaved=(nick)=>{
      setNickname(nick);
      setEditingNickname(false);
      toast(`Throne name set: ${nick} 👑`);
    };

    // ── Render logic ──
    if(user===undefined || (user && nickname===undefined)) return <LoadingScreen/>;
    if(user===null) return <LoginScreen/>;

    // First time: no nickname yet
    if(nickname===null) return (
      <NicknameModal
        uid={uid}
        photoURL={user.photoURL}
        log={log}
        title="What's your throne name?"
        subtitle="This is how you'll appear in the Hall of Plops. You can change it anytime."
        onSave={handleNicknameSaved}
      />
    );

    return (
      <div className="shell">
        <header className="top">
          <div className="brand">
            <div className="brand-mark">💩</div>
            <h1>The Royal Log</h1>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <nav className="nav" role="tablist">
              {[["home","Today","💩"],["month","Month","📅"],["ranks","Ranks","🏆"]].map(([k,lbl,ico])=>(
                <button key={k} aria-current={view===k} onClick={()=>setView(k)}>
                  <span className="ti">{ico}</span>
                  <span>{lbl}</span>
                  <span className="ti-dot"/>
                </button>
              ))}
            </nav>
            <UserMenu user={user} nickname={nickname} onChangeNickname={()=>setEditingNickname(true)}/>
          </div>
        </header>

        {view==="home" && (
          <>
            <HeroCounter todayCount={todayCount} onLog={logPoop} onUndo={undoLast} canUndo={log.length>0} streakDays={streakDays} weeklyAvg={weeklyAvg}/>
            <StatStrip stats={[
              {k:"Today",v:todayCount,unit:todayCount===1?" plop":" plops"},
              {k:"This Week",v:weekCount},
              {k:"This Month",v:monthCount},
              {k:"All-time",v:log.length},
            ]}/>
            <div className="grid two" style={{marginTop:18}}>
              <LogList log={log} onDelete={deleteOne}/>
              <TierCard monthlyCount={monthCount}/>
            </div>
          </>
        )}

        {view==="month" && (
          <div className="grid two">
            <CalendarMonth
              year={viewDate.getFullYear()} month={viewDate.getMonth()} counts={monthlyCounts}
              onPrev={()=>setViewDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1))}
              onNext={()=>setViewDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1))}
            />
            <div style={{display:"flex",flexDirection:"column",gap:18}}>
              <section className="card">
                <h2>This month at a glance</h2>
                <div className="sub">{monthLabel(viewDate)}</div>
                <div className="stat-strip" style={{marginTop:6}}>
                  <div className="stat"><div className="k">Total</div><div className="v tabnum">{Object.values(monthlyCounts).reduce((a,b)=>a+b,0)}</div></div>
                  <div className="stat"><div className="k">Active days</div><div className="v tabnum">{Object.keys(monthlyCounts).length}</div></div>
                  <div className="stat"><div className="k">Best day</div><div className="v tabnum">{Math.max(0,...(Object.values(monthlyCounts).length?Object.values(monthlyCounts):[0]))}</div></div>
                  <div className="stat"><div className="k">Per day avg</div><div className="v tabnum">{(Object.values(monthlyCounts).reduce((a,b)=>a+b,0)/new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate()).toFixed(2)}</div></div>
                </div>
              </section>
              <section className="card">
                <h2>Best day ever</h2>
                <div className="sub">A personal high-water mark.</div>
                {bestDay.count
                  ?<div style={{display:"flex",alignItems:"center",gap:14}}>
                    <div className="tier-badge" style={{background:"linear-gradient(160deg,#e7c98a,#a06a2a)"}}>🏆</div>
                    <div>
                      <div className="tier-name tabnum">{bestDay.count} plops</div>
                      <div className="tier-flavor">{bestDay.date.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
                    </div>
                  </div>
                  :<div style={{color:"var(--ink-2)"}}>No plops on record yet.</div>}
              </section>
            </div>
          </div>
        )}

        {view==="ranks" && (
          <div className="grid two">
            <HallOfPlops myUid={uid}/>
            <TierCard monthlyCount={monthCount}/>
          </div>
        )}

        <div className="foot">
          Stored securely in the cloud. <a href="#" onClick={(e)=>{e.preventDefault();resetAll();}}>Clear all</a>
        </div>

        {editingNickname && (
          <NicknameModal
            uid={uid}
            photoURL={user.photoURL}
            log={log}
            title="Change throne name"
            subtitle="Pick a new name. It'll update in the Hall of Plops right away."
            initial={nickname}
            onSave={handleNicknameSaved}
          />
        )}

        <MilestoneModal count={milestone?.count} message={milestone?.message} onClose={()=>setMilestone(null)}/>
        {toastNode}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
